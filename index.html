<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Winter Haiku - Interactive Design</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <!-- A grid container structure based on your reference -->
    <div class="grid-container">
        
        <!-- LINE 1 (5 syllables) -->
        <div>Soft</div>
        <div>white</div>
        <div>flakes</div>
        <div>fall</div>
        <div class="last line-end">down</div> <!-- Added extra classes for targeting and visual breaks -->

        <!-- LINE 2 (7 syllables) -->
        <div>Co</div>
        <div>ver</div>
        <div>ing</div>
        <div>the</div>
        <div>trees</div>
        <div>so</div>
        <div class="last line-end">still</div>

        <!-- LINE 3 (5 syllables) -->
        <div>Si</div>
        <div>lent</div>
        <div>win</div>
        <div>ter</div>
        <div class="last">night</div>

    </div>

</body>
</html>
